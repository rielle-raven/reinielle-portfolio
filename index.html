<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reinielle Lery C. Balita | Architecture Portfolio</title>
<meta name="description" content="Architecture portfolio of Reinielle Lery C. Balita.">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff}
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#151515;border-bottom:1px solid #333}
.title{font-size:16px;font-weight:600;letter-spacing:.3px}.sub{font-size:12px;color:#aaa;margin-top:3px}
.actions{display:flex;gap:8px}.btn{display:inline-block;padding:9px 13px;border:1px solid #555;border-radius:6px;color:#fff;text-decoration:none;font-size:13px;background:#222}
.btn:hover{background:#333}
main{height:calc(100% - 64px);display:flex;align-items:center;justify-content:center;background:#222}
iframe{width:100%;height:100%;border:0;background:#fff}
@media(max-width:600px){header{height:auto;min-height:64px;padding:10px 12px}.title{font-size:14px}.actions .btn{padding:8px 9px;font-size:12px}}
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Reinielle Lery C. Balita</div>
    <div class="sub">Architecture Portfolio · 2025</div>
  </div>
  <div class="actions">
    <a class="btn" href="portfolio.pdf" target="_blank">Open PDF</a>
    <a class="btn" href="portfolio.pdf" download>Download</a>
  </div>
</header>
<main>
  <iframe src="portfolio.pdf#view=FitH" title="Architecture Portfolio PDF"></iframe>
</main>
</body>
</html>
